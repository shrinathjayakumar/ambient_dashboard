{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ambience Enhancer - Ambient Dashboard</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}">
    <style>
        body { background: linear-gradient(135deg, #1e1e38, #2a2a4a) !important; }
    </style>
</head>
<body>
    <header>
        <h1>Edit Ambience Enhancer</h1>
        <a href="{% url 'dashboard' %}" class="yt-button">Cancel & Return</a>
    </header>

    <main>
        <div class="music-player-card" style="flex-direction: column; align-items: stretch; max-width: 600px; margin: 0 auto; padding: 30px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 3rem;">{{ sound.icon }}</span>
                <h2 style="color: var(--primary-color); margin-top: 5px;">{{ sound.name }}</h2>
            </div>
            
            <form method="POST" style="display:flex; flex-direction:column; gap:20px;">
                {% csrf_token %}
                <div style="display:flex; flex-direction:column; text-align:left;">
                    <label style="margin-bottom:5px; font-weight:600; color: rgba(255,255,255,0.7);">Emoji Icon</label>
                    <input type="text" name="icon" value="{{ sound.icon }}" required style="padding:15px; border-radius:10px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:#fff; font-size:1rem; width: 100px;">
                </div>
                <div style="display:flex; flex-direction:column; text-align:left;">
                    <label style="margin-bottom:5px; font-weight:600; color: rgba(255,255,255,0.7);">Name</label>
                    <input type="text" name="name" value="{{ sound.name }}" required style="padding:15px; border-radius:10px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:#fff; font-size:1rem;">
                </div>
                <div style="display:flex; flex-direction:column; text-align:left;">
                    <label style="margin-bottom:5px; font-weight:600; color: rgba(255,255,255,0.7);">URL (YouTube Audio Source)</label>
                    <input type="url" name="url" value="{{ sound.audio_url }}" required style="padding:15px; border-radius:10px; border:1px solid var(--border-color); background:rgba(255,255,255,0.05); color:#fff; font-size:1rem;">
                </div>
                
                <div style="display:flex; gap: 15px; margin-top: 10px;">
                    <button type="submit" class="yt-button" style="flex: 2; padding:15px; border-radius:10px; font-size:1rem; background:var(--primary-color); color:#fff; border:none; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);">Save Changes</button>
                    
                    <button type="button" class="yt-button" onclick="document.getElementById('delete-form').submit();" style="flex: 1; padding:15px; border-radius:10px; font-size:1rem; background:rgba(255, 77, 77, 0.1); color:#ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3);">Delete</button>
                </div>
            </form>

            <form id="delete-form" method="POST" action="{% url 'delete_sound' sound.id %}" style="display: none;">
                {% csrf_token %}
            </form>
        </div>
    </main>
</body>
</html>
